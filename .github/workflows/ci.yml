name: APOLO LangDock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      APOLO_DB_PATH: /tmp/apolo-langdock-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api
      - run: cd apps/api && pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apolo
          POSTGRES_PASSWORD: apolo-ci-password
          POSTGRES_DB: apolo_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apolo -d apolo_migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APOLO_DB_PATH: /tmp/apolo-migration.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - name: Initialize a representative SQLite schema
        working-directory: apps/api
        run: python -c "import app.main"
      - name: Migrate SQLite schema and data to PostgreSQL
        run: python scripts/migrate_sqlite_to_postgres.py --sqlite /tmp/apolo-migration.sqlite3 --database-url postgresql://apolo:apolo-ci-password@localhost:5432/apolo_migration

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp>=1.28,<2"
      - run: python -m compileall -q .
      - run: python -c "from server import mcp; assert mcp"
