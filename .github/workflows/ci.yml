name: APOLO LangDock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      APOLO_DB_PATH: /tmp/apolo-langdock-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api
      - run: cd apps/api && pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apolo
          POSTGRES_PASSWORD: apolo-ci-password
          POSTGRES_DB: apolo_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apolo -d apolo_migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APOLO_DB_PATH: /tmp/apolo-migration.sqlite3
      APOLO_DATABASE_URL: postgresql://apolo:apolo-ci-password@localhost:5432/apolo_migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - name: Initialize a representative SQLite schema
        working-directory: apps/api
        run: python -c "import app.main"
      - name: Seed representative relational data
        run: |
          python - <<'PY'
          import os, sqlite3
          conn = sqlite3.connect(os.environ["APOLO_DB_PATH"])
          conn.execute("INSERT INTO users(id,email,password_hash,created_at) VALUES(?,?,?,?)",
                       ("user-ci", "migration@example.test", "test-hash", "2026-01-01T00:00:00+00:00"))
          conn.execute("INSERT INTO workspaces(id,name,created_at) VALUES(?,?,?)",
                       ("workspace-ci", "Migration test", "2026-01-01T00:00:00+00:00"))
          conn.execute("INSERT INTO workspace_members(workspace_id,user_id,role,created_at) VALUES(?,?,?,?)",
                       ("workspace-ci", "user-ci", "owner", "2026-01-01T00:00:00+00:00"))
          conn.commit()
          conn.close()
          PY
      - name: Migrate SQLite schema and data to PostgreSQL
        run: python scripts/migrate_sqlite_to_postgres.py --sqlite /tmp/apolo-migration.sqlite3 --database-url "$APOLO_DATABASE_URL"
      - name: Verify migrated records on PostgreSQL
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["APOLO_DATABASE_URL"]) as conn:
              assert conn.execute("SELECT email FROM users WHERE id='user-ci'").fetchone()[0] == "migration@example.test"
              assert conn.execute("SELECT role FROM workspace_members WHERE workspace_id='workspace-ci'").fetchone()[0] == "owner"
          PY

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp>=1.28,<2"
      - run: python -m compileall -q .
      - run: python -c "from server import mcp; assert mcp"
