services:
  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      APOLO_DB_PATH: /data/apolo-langdock.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - apolo_data:/data
    restart: unless-stopped
  mcp:
    build:
      context: ./apps/mcp-server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  apolo_data:
